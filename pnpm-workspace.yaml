allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.0"
  - "@effect/platform-node@4.1.0"
  - effect@4.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  traits:
    skills: true
skills:
  dirs:
    - .agents/skills
